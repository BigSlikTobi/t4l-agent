name: Verify Linux release

on:
  workflow_dispatch:

permissions:
  # Required only while verifying assets held in a private draft release.
  # Revert to read after the release receipts have been downloaded.
  contents: write

jobs:
  verify:
    name: linux-x64-cp${{ matrix.cp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            cp: "311"
          - python: "3.12"
            cp: "312"
          - python: "3.13"
            cp: "313"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install release verifier
        run: python -m pip install cryptography==46.0.7 PyYAML==6.0.3

      - name: Install pinned OpenClaw test runtime
        run: >-
          npm install --prefix "$RUNNER_TEMP/openclaw"
          --ignore-scripts --no-audit --no-fund openclaw@2026.7.1-2

      - name: Download draft release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release build/plugin build/receipts
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == "v0.3.0") | .id')"
          test -n "$release_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r asset_id asset_name; do
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                -H "Accept: application/octet-stream" > "build/release/$asset_name"
            done
          tar -xzf build/release/t4l-trainer-openclaw-t4l-connect-0.2.0.tgz \
            -C build/plugin --strip-components=1

      - name: Verify offline install and OpenClaw lifecycle
        env:
          T4L_OPENCLAW_EXECUTABLE: ${{ runner.temp }}/openclaw/node_modules/openclaw/openclaw.mjs
          PIP_NO_INDEX: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          npm_config_offline: "true"
        run: |
          export T4L_NODE_EXECUTABLE="$(command -v node)"
          sudo iptables-save > "$RUNNER_TEMP/iptables.rules"
          restore_network() { sudo iptables-restore < "$RUNNER_TEMP/iptables.rules"; }
          trap restore_network EXIT
          sudo iptables -F OUTPUT
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          python scripts/release_tools.py verify-target \
            --target linux-x64-cp${{ matrix.cp }} \
            --release-id t4l-agent-0.3.0 \
            --version 0.3.0 \
            --agent-wheel build/release/t4l_agent-0.3.0-py3-none-any.whl \
            --server-wheel build/release/t4l_server-0.8.0-py3-none-any.whl \
            --wheelhouse build/release/t4l-python-wheelhouse-0.3.0.tar.gz \
            --instructions build/release/t4l-agent-instructions-0.3.0.tar.gz \
            --staged-plugin build/plugin \
            --output build/receipts/linux-x64-cp${{ matrix.cp }}.json \
            --plugin-smoke-command "$GITHUB_WORKSPACE/scripts/openclaw_lifecycle_smoke.py"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-cp${{ matrix.cp }}-receipt
          path: build/receipts/linux-x64-cp${{ matrix.cp }}.json
          if-no-files-found: error
          retention-days: 7
